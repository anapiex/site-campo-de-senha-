<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CipherFlow - Codificador de Senhas & Passo a Passo</title>
  
  <!-- Fontes do Google (Poppins e Fira Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-user-shield"></i>
        <span>CipherFlow</span>
      </div>
      <button id="theme-toggle" class="btn-icon" aria-label="Alternar Tema">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- Formulário de Entrada -->
    <main class="main-card">
      <section class="input-section">
        <label for="password-input">Digite sua senha ou código:</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key input-icon"></i>
          <input 
            type="text" 
            id="password-input" 
            placeholder="Ex: MinhaSenha123" 
            autocomplete="off"
            required
          >
          <button id="clear-btn" class="btn-clear" title="Limpar campo">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="algorithm-selector">
          <label for="algo-select">Escolha o nível de codificação:</label>
          <select id="algo-select">
            <option value="basic">Básico (Inversão + Substituição Leet + Shift)</option>
            <option value="medium">Intermediário (+ Base64 + Prefixo Hash)</option>
            <option value="advanced">Avançado (+ Hexadecimal + Salt + Embaralhamento)</option>
          </select>
        </div>

        <button id="encode-btn" class="btn btn-primary">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Codificar e Ver Passo a Passo
        </button>
      </section>

      <!-- Resultado Final -->
      <section id="result-section" class="result-section hidden">
        <hr class="divider">
        
        <div class="final-output-card">
          <span class="label">Senha Codificada Final:</span>
          <div class="output-wrapper">
            <code id="final-password">...</code>
            <button id="copy-btn" class="btn-copy" title="Copiar código">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>

        <!-- Linha do Tempo do Passo a Passo -->
        <div class="steps-container">
          <h3><i class="fa-solid fa-route"></i> Passo a Passo da Transformação</h3>
          <div id="steps-list" class="steps-list">
            <!-- Os passos serão inseridos dinamicamente pelo JavaScript -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
